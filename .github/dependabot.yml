version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    cooldown:
      default-days: 7
    ignore:
      # https://github.com/mozilla/eslint-config-amo/issues/797
      - dependency-name: eslint
        versions:
          - ">= 10"
      # https://github.com/mozilla/eslint-config-amo/issues/798
      - dependency-name: "@eslint/js"
        versions:
          - ">= 10"
    allow:
      - dependency-type: "development"
        update-types:
          # Let's ignore "semver-patch" releases for dev dependencies to reduce
          # the amount of PRs we get every day.
          - "version-update:semver-minor"
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    groups:
      ssdlc-actions:
        patterns:
          - "mozilla/ssdlc-actions/*"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 99
